<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Codetta</title>
    <!--
      Replaced per repository by internal/site when a permalink is served, and left exactly as
      it is by the dev server and by any static host. So the default below has to be a card
      that is true of the whole site rather than a placeholder: an unfurl that says nothing is
      worse than one that says something general.
    -->
    <!--og:start-->
    <meta property="og:title" content="Codetta" />
    <meta
      property="og:description"
      content="Paste a GitHub repository. Hear what it sounds like."
    />
    <meta property="og:image" content="/og/cover.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <!--og:end-->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
